          case "$job" in issue|score) ;; *) echo "bad job $job"; exit 1 ;; esac
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "job: $job"

      # Sparse: the frozen development kline grids of the 20 D12 series (spent development sets only; no locked blind
      # set) and the D12 live block.
      - name: Check out membrane-datasets (main, sparse, D12 inputs only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          repository: ${{ env.DATASETS_REPO }}
          token: ${{ secrets.DATASETS_TOKEN }}
          ref: main
          path: datasets
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /binance-klines/ETHUSDT-1h.json
            /binance-klines/BTCUSDT-1h.json
            /binance-klines/BNBUSDT-1h.json
            /binance-klines/XRPUSDT-1h.json
            /binance-klines/ADAUSDT-1h.json
            /binance-klines/LTCUSDT-1h.json
            /binance-klines/DOGEUSDT-1h.json
            /binance-klines/LINKUSDT-1h.json
            /binance-klines/SOLUSDT-1h.json
            /binance-klines/AVAXUSDT-1h.json
