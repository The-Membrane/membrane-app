  # D13 (HISTORY_TOUCH_LIVE.md D13): oracle-crossing odds and their live calibration monitor. Its own job so that it
  # never eats the budget of `run`, `d11` or `d12`. It runs after all three (pass or fail, not cancelled) on the same
  # trigger; it pushes only forecasts/q26-touch-live/d13/. Credential handling is identical to `d12`. Public log:
  # status and counts only.
  d13:
    needs: [run, d11, d12]
    if: ${{ !cancelled() && github.repository == 'The-Membrane/membrane-app' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: q26-datasets
