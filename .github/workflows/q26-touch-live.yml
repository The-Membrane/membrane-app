          grep -E '^d12 replay: [0-9]+ of [0-9]+ rows equal, [0-9]+ of [0-9]+ labels equal, [0-9]+ of [0-9]+ look-ahead equal$' "$out" || true
          grep -E '^d12 klines: [0-9]+ ok, [0-9]+ failed, \+[0-9]+ klines$' "$out" || true
          grep -E '^d12 issue: [0-9]+ series issued, [0-9]+ not issued$' "$out" || true
          grep -qE '^d12 issue: none ' "$out" && echo "d12 issue: none" || true
          grep -E '^d12 scored: [0-9]+ cell-days finalized, [0-9]+ horizons pending, ledger [0-9]+ lines$' "$out" || true
