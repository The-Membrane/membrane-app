# Q26 D14 -- borrower-alert SHADOW log on Aave V3 (triccs/membrane-board design/HISTORY_TOUCH_LIVE.md block D14;
# design/q26-borrower-alert-live-2026-10-25.md). Owner approval 2026-10-25 on OWNER? Q26-L1: "Yes: Aave V3 all chains
# (Recommended)". RULING Q26-R27 episodes (at risk at 3 % of the line, act now at the line), hourly, counts only.
# NOTHING IS SHOWN TO USERS AND NO ALERT IS SENT. It moves to Membrane positions when a Membrane Cdp is deployed on a
# public chain (a later dated block).
#
# OFF SWITCH (owner turned the job ON 2026-10-25): the job runs unless the repository variable BORROWER_ALERT_ENABLED is exactly `false`
#   (Settings -> Secrets and variables -> Actions -> Variables). Set it to `false` to stop the job; unset or any other value = on.
#   Turning it off loses no history. Disabling this workflow in the Actions tab also stops it.
# Code: membrane-app research/history-forecasts at the PINNED full commit D14_APP_SHA (moves only by a dated note in
#   the D14 block). Data: triccs/membrane-datasets (private), forecasts/q26-borrower-alert/ only.
# Credential: DATASETS_TOKEN (existing secret of the q26-datasets environment) reaches only the datasets checkout
#   (persist-credentials: false) and the push (per-command extraheader through GIT_CONFIG_* variables, global and
#   system git config ignored). The code step never receives it. Keyless public RPC endpoints and the keyless Binance
#   data API only.
# PUBLIC LOGS: the run's own output is written to a runner temp file and deleted; the log shows the exit status, line
#   counts and whitelisted count-only lines. No address, key, distance or position id. No artifacts.
# A failed run commits nothing; the next hour checks the current state. Nothing is backfilled.

name: q26-borrower-alert

on:
  schedule:
    - cron: "23 * * * *"   # hourly at :23 (off the :00 rush and off the daily q26-touch-live runs at :17 and :47)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q26-borrower-alert
  cancel-in-progress: false

env:
  APP_REPO: The-Membrane/membrane-app
  # D14 (2026-10-25): this job alone runs this pin. APP_SHA, D11_APP_SHA, D12_APP_SHA and D13_APP_SHA (q26-touch-live.yml)
  # are not touched.
  D14_APP_SHA: 5bb18c327e7d4deef68e4d74253942534c232749   # D14 (membrane-board ba183cc); BNB/Arbitrum endpoint fix 2026-10-25; Multicall gas-cap split 2026-10-26; 400 rotates, Arbitrum endpoints 2026-10-26
  DATASETS_REPO: triccs/membrane-datasets
  D14_DIR: forecasts/q26-borrower-alert

defaults:
  run:
    shell: bash

jobs:
  d14:
    if: ${{ !cancelled() && vars.BORROWER_ALERT_ENABLED != 'false' && github.repository == 'The-Membrane/membrane-app' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: q26-datasets
    steps:
      - name: Check out membrane-datasets (main, sparse, D14 block only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          repository: ${{ env.DATASETS_REPO }}
          token: ${{ secrets.DATASETS_TOKEN }}
          ref: main
          path: datasets
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /forecasts/q26-borrower-alert/

      - name: Record the datasets git config (checked again before the push)
        id: gitcfg
        run: echo "sha256=$(sha256sum datasets/.git/config | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Check out membrane-app at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.D14_APP_SHA }}
          path: app
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/research/history-forecasts

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7
        with:
          python-version: "3.12"

      - name: D14 hourly check (standard library only)
        run: |
          set +x
          out="$RUNNER_TEMP/q26-d14.log"; rc=0
          python app/scripts/research/history-forecasts/live/q26_live_d14.py run \
            --out datasets --expect-commit "$D14_APP_SHA" >"$out" 2>&1 || rc=$?
          # Public log: status and counts only. The run's own output is withheld and deleted.
          echo "exit $rc; output withheld: $(wc -l <"$out") lines, STOP $(grep -c '^STOP' "$out" || true)," \
               "Traceback $(grep -c '^Traceback' "$out" || true)"
          grep -E '^d14 run: hour [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:00Z, [0-9]+ chains ok, [0-9]+ stale, [0-9]+ pending$' "$out" || true
          grep -E '^d14 run: none \(hour [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:00Z already checked\)$' "$out" || true
          grep -E '^d14 chain [a-z]+: (ok, [0-9]+ positions, [0-9]+ within 10%, [0-9]+ unresolved, at-risk [0-9]+ oracle [0-9]+ iii, [0-9]+ liquidations, [0-9]+s|stale|pending)$' "$out" || true
          grep -E '^d14 iii: [0-9]+ symbols, [0-9]+ failed$' "$out" || true
          grep -E '^d14 daily: snapshot [0-9]{4}-[0-9]{2}-[0-9]{2} written, [0-9]+ members$' "$out" || true
          grep -E '^d14 checks: ledger [0-9]+ days verified, [0-9]+ address patterns in public files$' "$out" || true
          rm -f "$out"
          exit "$rc"

      - name: Commit forecasts/q26-borrower-alert/ and push to membrane-datasets main (pull --rebase, up to 3 retries)
        working-directory: datasets
        env:
          GITCFG_SHA256: ${{ steps.gitcfg.outputs.sha256 }}
          DATASETS_TOKEN: ${{ secrets.DATASETS_TOKEN }}
          GIT_CONFIG_GLOBAL: /dev/null   # as D12-A2: no global or system git config in the push step
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          set +x
          if [ "$(sha256sum .git/config | cut -c1-64)" != "$GITCFG_SHA256" ]; then
            echo "datasets .git/config changed after checkout; not pushing"; exit 1
          fi
          git config user.name "q26-live-bot"
          git config user.email "q26-live-bot@users.noreply.github.com"
          git add -- "$D14_DIR"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "forecasts/q26-borrower-alert: hourly $(date -u +%Y-%m-%dT%H:%MZ) (Q26 D14 shadow log, app ${D14_APP_SHA:0:7})" -- "$D14_DIR"
          echo "committed $(git show --name-only --format= HEAD | wc -l) file(s)"
          auth="$(printf 'x-access-token:%s' "$DATASETS_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          unset DATASETS_TOKEN
          # Per-command config: the header and a disabled hooks path (command-line precedence over .git/config).
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          export GIT_CONFIG_KEY_1="core.hooksPath" GIT_CONFIG_VALUE_1="/dev/null"
          for attempt in 1 2 3 4; do   # the first try plus up to 3 retries
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          echo "push failed after 3 retries"; exit 1

  # Hourly chain (owner 2026-10-25: "make it hourly on GitHub"). GitHub's cron on this repo fires hours late or not at
  # all, so each run waits until :05 of the next hour and starts the next run itself. The cron above stays as a backup.
  # One chain only: a run does not dispatch while an OLDER run of this workflow is queued or running (the older one
  # dispatches), so parallel chains merge within an hour. The off switch above stops the chain too. Public repo:
  # the waiting runner costs no billed minutes.
  next-hour:
    needs: d14
    if: ${{ !cancelled() && vars.BORROWER_ALERT_ENABLED != 'false' && github.repository == 'The-Membrane/membrane-app' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: write
    steps:
      - name: Wait for :05 of the next hour, then start that hour's run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          now=$(date +%s)
          next=$(( now - now % 3600 + 3600 + 300 ))
          echo "waiting $(( next - now )) s"
          sleep $(( next - now ))
          older=$(gh run list --workflow q26-borrower-alert.yml --limit 30 --json databaseId,status \
            --jq "[.[] | select(.status != \"completed\" and .databaseId < $RUN_ID)] | length")
          if [ "$older" -gt 0 ]; then echo "an older run is queued or running; it dispatches"; exit 0; fi
          gh workflow run q26-borrower-alert.yml --ref main
          echo "dispatched the next hour's run"
