# Q26 forward data collectors -- triccs/membrane-board design/Q26_COLLECTORS.md (preregistered at 14d01a8).
# Owner approval 2026-10-17 (RULING Q26 chapter). Later changes go only in the prereg's dated Deviations.
#
# Moved 2026-10-17 from the private triccs/membrane-datasets to this PUBLIC repo (owner ruling 2026-10-17:
# free Actions minutes; the data library stays private). Schedules run only from `main`, so THIS FILE LIVES ON
# `main`. Pin, cron times and the push loop are unchanged from the datasets workflow.
#
# Every 6 hours (UTC 00:23, 06:23, 12:23, 18:23); GitHub may run late, each record carries its real fetch time.
# Code: this repo at a PINNED full commit. Standard library only, no pip install.
# Data: triccs/membrane-datasets (private). The job commits collectors/ only, to its main. Public endpoints only.
# Credential: DATASETS_TOKEN only (fine-grained PAT, contents read/write on triccs/membrane-datasets only),
#       best kept as a secret of the `q26-datasets` environment restricted to `main`. It reaches exactly two
#       steps: the datasets checkout (persist-credentials: false, so nothing is left in .git/config) and the
#       final push, where it is passed per command as an HTTP header through GIT_CONFIG_* environment variables
#       (never a remote URL, never .git/config). The code step never receives it.
# PUBLIC LOGS: this repo's Actions logs are public. The collector's own output goes to a runner temp file that is
#       deleted; the log shows the exit status and, per source, only `source status bytes`. No artifacts. Git
#       runs quiet.
# Each source fails on its own: a failed source writes no data file (its slot stays missing) and its
# manifest line records the HTTP statuses. Files are created with O_EXCL and never rewritten. Nothing is
# backfilled. No address is stored (Hyperliquid accounts are aggregated in memory into liquidation bins).
# The datasets checkout is sparse: only collectors/ is fetched.

name: q26-collectors

on:
  schedule:
    - cron: "23 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q26-collectors
  cancel-in-progress: false

env:
  APP_REPO: The-Membrane/membrane-app
  APP_SHA: 2303e47ed1891a7453fa9beaac0516aca8d78d91   # membrane-app research/history-forecasts, collectors/q26_collectors.py
  DATASETS_REPO: triccs/membrane-datasets
  OUT_DIR: collectors

defaults:
  run:
    shell: bash

jobs:
  collect:
    if: github.repository == 'The-Membrane/membrane-app'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: q26-datasets
    steps:
      - name: Check out membrane-datasets (main, sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          repository: ${{ env.DATASETS_REPO }}
          token: ${{ secrets.DATASETS_TOKEN }}
          ref: main
          path: datasets
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /collectors/

      - name: Record the datasets git config (checked again before the push)
        id: gitcfg
        run: echo "sha256=$(sha256sum datasets/.git/config | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Check out membrane-app at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_SHA }}
          path: app
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/research/history-forecasts/collectors

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7
        with:
          python-version: "3.12"

      - name: Collect (C.2, C.3)
        id: collect
        continue-on-error: true   # all-sources-failed exits 1; the manifest lines are still committed
        run: |
          set +x
          out="$RUNNER_TEMP/q26-run.log"; rc=0
          python app/scripts/research/history-forecasts/collectors/q26_collectors.py \
            --out datasets --app-commit "$APP_SHA" \
            >"$out" 2>&1 || rc=$?
          # Public log: per source only `source status bytes` (no path, no error text); the rest is withheld.
          echo "exit $rc; output withheld: $(wc -l <"$out") lines, Traceback $(grep -c '^Traceback' "$out" || true)"
          sed -nE 's/^(polymarket-eth|polymarket-btc|deribit|lido|hyperliquid) +(ok|failed) +([0-9]+|-) .*$/\1 \2 \3/p' "$out"
          rm -f "$out"
          exit "$rc"

      - name: Commit collectors/ and push to membrane-datasets main (pull --rebase, up to 3 retries)
        working-directory: datasets
        env:
          GITCFG_SHA256: ${{ steps.gitcfg.outputs.sha256 }}
          DATASETS_TOKEN: ${{ secrets.DATASETS_TOKEN }}
        run: |
          set +x
          if [ "$(sha256sum .git/config | cut -c1-64)" != "$GITCFG_SHA256" ]; then
            echo "datasets .git/config changed after checkout; not pushing"; exit 1
          fi
          git config user.name "q26-collectors-bot"
          git config user.email "q26-collectors-bot@users.noreply.github.com"
          git add -- "$OUT_DIR"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "collectors: $(date -u +%Y-%m-%dT%H:%MZ) (Q26 collectors, app ${APP_SHA:0:7})" -- "$OUT_DIR"
          echo "committed $(git show --name-only --format= HEAD | wc -l) file(s)"
          auth="$(printf 'x-access-token:%s' "$DATASETS_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          unset DATASETS_TOKEN
          # Per-command config: the header and a disabled hooks path (command-line precedence over .git/config).
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          export GIT_CONFIG_KEY_1="core.hooksPath" GIT_CONFIG_VALUE_1="/dev/null"
          for attempt in 1 2 3 4; do   # the first try plus up to 3 retries
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          echo "push failed after 3 retries"; exit 1

      - name: Fail the run if every source failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo "every source failed this slot (see collectors/manifest/ in membrane-datasets)"; exit 1
