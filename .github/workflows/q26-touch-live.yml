# Q26 live forecast log -- triccs/membrane-board design/HISTORY_TOUCH_LIVE.md (registered at 9ce3c61,
# sha256 8961eb5ca2b6da58d080a3b19d8eb04712eecfc777021fc56f8dfe040a1cc4e4). Owner approval 2026-10-14.
# Model A5 from 2026-10-15: HISTORY_TOUCH_LIVE.md D2 (membrane-board a5ce1bb) moves the pin and adds the A5 inputs.
# Model A6 from 2026-10-17: HISTORY_TOUCH_LIVE.md D3 (membrane-board f16637c) moves the pin and adds the A6 frozen file.
# D4 (membrane-board 0fd1020) adds the blind-5 basis file.
# D8 (2026-10-18, membrane-board 4170235): short horizons 1 h / 3 h / 12 h with (fH), shallow levels, hourly origins
#    inside the daily issue (--short-fh), scored inside the daily score job. Log only. Cron times unchanged.
# D9 (2026-10-18, membrane-board 929cf6e): deep levels -15/-20% (-25% reported) at 12 h / 1 d / 3 d with (fH),
#    ETH and BTC, hourly origins inside the daily issue (--deep-fh); the score job (--deep-fh) scores them against four
#    touch targets and appends two new stores (Binance 1 m klines, Chainlink AnswerUpdated logs). Log only. Cron
#    times, sparse lists and frozen inputs unchanged.
# D10 (2026-10-18, membrane-board 0582957): the score job (--membrane-oracle) adds a fifth deep target, Membrane's own
#    oracle (median of fixed Uniswap V3 route 1 h tick-TWAPs), and appends the membrane-oracle store (per-block swap
#    ticks seeded by slot0, quote-feed answers). Report only. Issue step, cron times, sparse lists unchanged.
# D11 (2026-10-23, membrane-board HISTORY_TOUCH_LIVE.md D11; owner approval 2026-10-23): the frozen GRU rule D vs (fH)
#    on the 273 Binance development series (ETHUSDT/BTCUSDT descriptive), daily 00:00Z origins, walk-forward Platt,
#    an anytime-valid e-process ledger. Log only. A SECOND JOB `d11` in this same workflow, run after `run` by the
#    same two cron events (its own runner and 30-minute limit; no new cron, no new workflow, no new secret). It writes
#    only forecasts/q26-touch-live/d11/. The main job's steps and flags are unchanged (only the pin moves).
# D12 (2026-10-24, membrane-board HISTORY_TOUCH_LIVE.md D12; owner ruling e06202c "Yes, with live tracking"): the live
#    calibration monitor of the CALIBRATED-WARN borrower cells (raw (fH) as R19.2; Binance ETHUSDT/BTCUSDT and 18 large
#    caps; -10% 6 h-7 d, -20% 1 d-7 d; daily 00:00Z origins; anytime-valid downgrade flag in d12/classes.json). A THIRD
#    JOB `d12`, run after `run` and `d11` by the same two cron events (own runner and 30-minute limit; no new cron, no
#    new workflow, no new secret). It writes only forecasts/q26-touch-live/d12/. The run and d11 jobs are unchanged.
# D12-A2 (2026-10-24, review must-fixes): d12 re-pinned (pooled shallow monitor, default classes); d11 and d12 run
#    on `!cancelled()` instead of `always()`; the d12 push step ignores global/system git config.
# D13 (2026-10-24, membrane-board HISTORY_TOUCH_LIVE.md D13; owner approval "Deploy D13"): oracle-crossing odds, raw
#    (fH) on the 1 h TWAP path of Binance 1 m closes, target (b) = the 1 h TWAP crossing G(t0)(1 + k), with the D12-A2
#    monitor rule, a report-only ratio arm and a report-only "liquidation path unavailable" flag. A FOURTH JOB `d13`,
#    run after `run`, `d11` and `d12` by the same two cron events (own runner and 30-minute limit; no new cron, no new
#    workflow, no new secret). It writes only forecasts/q26-touch-live/d13/ (it reads d12/klines/ read only). Nothing
#    is shown to users. The run, d11 and d12 jobs are unchanged.
# D13-A1/A2 (2026-10-24, HISTORY_TOUCH_LIVE.md D13-A2 and the D13-A1 deployment note): the d13 job alone is re-pinned
#    (should-fixes; report-only Chainlink and Uniswap pool-TWAP input arms under d13/arms/). The run, d11 and d12 jobs,
#    their pins, the cron times and the secrets are unchanged.
#
# Moved 2026-10-17 from the private triccs/membrane-datasets to this PUBLIC repo (owner ruling 2026-10-17:
# free Actions minutes; the data library stays private). Schedules run only from `main`, so THIS FILE LIVES ON
# `main`. Pin, inputs, sha256s, flags, cron times and the push loop are unchanged from the datasets workflow.
#
# Daily (UTC): 00:17 issue, 00:47 score; workflow_dispatch can run either job.
# Code: this repo at a PINNED full commit (L.1). A model change moves the pin only through a dated deviation in
#       the prereg.
# Data: triccs/membrane-datasets (private). The job commits forecasts/q26-touch-live/ only, to its main.
# Credential: DATASETS_TOKEN only (fine-grained PAT, contents read/write on triccs/membrane-datasets only),
#       best kept as a secret of the `q26-datasets` environment restricted to `main`. It reaches exactly two
#       steps: the datasets checkout (persist-credentials: false, so nothing is left in .git/config) and the
#       final push, where it is passed per command as an HTTP header through GIT_CONFIG_* environment variables
#       (never a remote URL, never .git/config). The code steps never receive it. Public RPCs only.
# PUBLIC LOGS: this repo's Actions logs are public. The issuer's and scorer's own output (it can hold regimes,
#       addresses and other data) goes to a runner temp file that is deleted; the log shows the exit status,
#       line counts and whitelisted count-only lines. No artifacts. Git runs quiet. To diagnose a failed run,
#       rerun the same command locally at the pinned commit.
# A failed run commits nothing and leaves its day missing. Nothing is backfilled.
# The datasets checkout is sparse: only the frozen inputs the refit reads and the live log are fetched
# (locked blind sets are never downloaded).

name: q26-touch-live

on:
  schedule:
    - cron: "17 0 * * *"   # issue
    - cron: "47 0 * * *"   # score
  workflow_dispatch:
    inputs:
      job:
        description: "issue or score"
        required: true
        default: score
        type: choice
        options: [issue, score]

permissions:
  contents: read

concurrency:
  group: q26-touch-live
  cancel-in-progress: false

env:
  APP_REPO: The-Membrane/membrane-app
  APP_SHA: 5570128d46ac55180922aacc358a8f8be4add0d6   # membrane-app research/history-forecasts, live/ code (model A6 + displayed rung + D8 short horizons + D9 deep levels + D10 Membrane oracle target + D11 GRU arm)
  D11_INPUTS: history-forecasts/r16/d11-inputs-b4f337cc
  # D11 amendment D11-A1 (2026-10-23): the d11 job alone moves to the review-fix pin; the main job stays at APP_SHA.
  D11_APP_SHA: b6c1bb33a058af44e1b3ac750a9c843410691601
  # D12 (2026-10-24): the d12 job alone runs this pin; APP_SHA and D11_APP_SHA do not move. D12-A2 re-pins it.
  D12_APP_SHA: a5079f729beb3d61c2ee2f18d04f42011d624ca9   # D12-A2 (pooled shallow monitor, default classes, classes.json fixes)
  # D13 (2026-10-24): the d13 job alone runs this pin; APP_SHA, D11_APP_SHA and D12_APP_SHA do not move.
  D13_APP_SHA: 485b35b6dc95ad71131f6f418350a7fb2b3b3f84   # D13 + D13-A1 arms + D13-A2 (inputs d13-inputs-93d337c9, d13a1-inputs-1c64ee0e)
  DATASETS_REPO: triccs/membrane-datasets
  LIVE_DIR: forecasts/q26-touch-live

defaults:
  run:
    shell: bash

jobs:
  run:
    if: github.repository == 'The-Membrane/membrane-app'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: q26-datasets
    steps:
      - name: Choose the job
        id: job
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then job="$INPUT_JOB"
          elif [ "$SCHEDULE" = "17 0 * * *" ]; then job=issue
          elif [ "$SCHEDULE" = "47 0 * * *" ]; then job=score
          else echo "unknown trigger"; exit 1; fi
          case "$job" in issue|score) ;; *) echo "bad job $job"; exit 1 ;; esac
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "job: $job"

      - name: Check out membrane-datasets (main, sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          repository: ${{ env.DATASETS_REPO }}
          token: ${{ secrets.DATASETS_TOKEN }}
          ref: main
          path: datasets
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /price-history/
            /deribit-dvol/
            /binance-klines/ETHUSDT-1h.json
            /binance-klines/BTCUSDT-1h.json
            /history-forecasts/a3/run-a99eff8/frozen-a3.json
            /history-forecasts/a5/run-c6d70b36/frozen-a5.json
            /history-forecasts/a5/run-c6d70b36/basis-final.csv
            /history-forecasts/a6/run-015512cb/frozen-a6.json
            /history-forecasts/a6/run-015512cb/basis-final-a6.csv
            /history-forecasts/a6/run-015512cb/display-a6.json
            /forecasts/q26-touch-live/

      - name: Record the datasets git config (checked again before the push)
        id: gitcfg
        run: echo "sha256=$(sha256sum datasets/.git/config | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Check out membrane-app at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_SHA }}
          path: app
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/research/history-forecasts

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 pandas==3.0.5

      - name: Issue (L.2, L.3)
        if: steps.job.outputs.job == 'issue'
        run: |
          set +x
          out="$RUNNER_TEMP/q26-run.log"; rc=0
          python app/scripts/research/history-forecasts/live/q26_live_issue.py \
            --datasets datasets --out datasets --expect-commit "$APP_SHA" \
            --frozen-a5 history-forecasts/a5/run-c6d70b36/frozen-a5.json \
            --frozen-a5-sha256 7e75cc2a27cb67fded145ac8124c2074c7f3974429f2c48d423740fd0d4a10fa \
            --basis-final history-forecasts/a5/run-c6d70b36/basis-final.csv \
            --basis-final-sha256 d6b2ff2f9332b8d11f6eac43efed9f151a87847d94f35f915eee0c5164b6a477 \
            --frozen-a6 history-forecasts/a6/run-015512cb/frozen-a6.json \
            --frozen-a6-sha256 97501da3fbb4de25c0257b6945a061543bf7fbef1344246cd47b418664bf02c0 \
            --basis-final-a6 history-forecasts/a6/run-015512cb/basis-final-a6.csv \
            --basis-final-a6-sha256 328a934d22d00bbba3eed8edc5879701647377d9c5734e4d6a2ef8998f61c7c1 \
            --display-a6 history-forecasts/a6/run-015512cb/display-a6.json \
            --display-a6-sha256 8e9086179ac40da1ec90976c5ba6a551c3893b002f0b7338a097a777a8362e62 \
            --short-fh \
            --deep-fh \
            >"$out" 2>&1 || rc=$?
          # Public log: status and counts only. The run's own output is withheld and deleted.
          echo "exit $rc; output withheld: $(wc -l <"$out") lines, STOP $(grep -c '^STOP' "$out" || true)," \
               "FAILED $(grep -c 'FAILED' "$out" || true), Traceback $(grep -c '^Traceback' "$out" || true)"
          grep -E '^(rounds (ETH|BTC|stETH): (append|bootstrap) \+[0-9]+ \(store [0-9]+\)|binance [A-Z]+: \+[0-9]+ \(store [0-9]+\))$' "$out" || true
          sed -nE 's/^wrote .*; ([0-9]+) rows$/issued: \1 rows/p' "$out"
          grep -E '^short: [0-9]+ origins, [0-9]+ rows$' "$out" || true
          grep -E '^deep: [0-9]+ origins, [0-9]+ rows$' "$out" || true
          rm -f "$out"
          exit "$rc"

      - name: Score (L.4)
        if: steps.job.outputs.job == 'score'
        run: |
          set +x
          out="$RUNNER_TEMP/q26-run.log"; rc=0
          python app/scripts/research/history-forecasts/live/q26_live_score.py \
            --out datasets --expect-commit "$APP_SHA" \
            --deep-fh \
            --membrane-oracle \
            >"$out" 2>&1 || rc=$?
          # Public log: status and counts only. The run's own output is withheld and deleted.
          echo "exit $rc; output withheld: $(wc -l <"$out") lines, STOP $(grep -c '^STOP' "$out" || true)," \
               "FAILED $(grep -c 'FAILED' "$out" || true), Traceback $(grep -c '^Traceback' "$out" || true)"
          grep -E '^(rounds (ETH|BTC|stETH): (append|bootstrap) \+[0-9]+ \(store [0-9]+\)|binance [A-Z]+: \+[0-9]+ \(store [0-9]+\)|scored: [0-9]+ new outcomes \([0-9]+ resolved\), [0-9]+ pending, [0-9]+ outcomes in total from [0-9]+ issue files|short scored: [0-9]+ new outcomes \([0-9]+ resolved\), [0-9]+ pending, [0-9]+ outcomes in total)$' "$out" || true
          grep -E '^(binance1m [A-Z]+: (\+[0-9]+ \(store [0-9]+\)|FAILED)|oraclelogs (ETH|BTC): ((bootstrap|append) \+[0-9]+ \(store [0-9]+\)|FAILED)|deep scored: [0-9]+ new outcomes, [0-9]+ pending, [0-9]+ outcomes in total, [0-9]+ store errors)$' "$out" || true
          grep -E '^(membrane store: ((bootstrap|append) \+[0-9]+ ticks \+[0-9]+ quotes \(store [0-9]+\)|FAILED)|membrane observe check: [0-9]+ pools, max \|diff\| [0-9]+ ticks)$' "$out" || true
          rm -f "$out"
          exit "$rc"

      - name: Commit forecasts/q26-touch-live/ and push to membrane-datasets main (pull --rebase, up to 3 retries)
        working-directory: datasets
        env:
          JOB: ${{ steps.job.outputs.job }}
          GITCFG_SHA256: ${{ steps.gitcfg.outputs.sha256 }}
          DATASETS_TOKEN: ${{ secrets.DATASETS_TOKEN }}
        run: |
          set +x
          if [ "$(sha256sum .git/config | cut -c1-64)" != "$GITCFG_SHA256" ]; then
            echo "datasets .git/config changed after checkout; not pushing"; exit 1
          fi
          git config user.name "q26-live-bot"
          git config user.email "q26-live-bot@users.noreply.github.com"
          git add -- "$LIVE_DIR"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "forecasts/q26-touch-live: $JOB $(date -u +%Y-%m-%dT%H:%MZ) (Q26 live log, app ${APP_SHA:0:7})" -- "$LIVE_DIR"
          echo "committed $(git show --name-only --format= HEAD | wc -l) file(s)"
          auth="$(printf 'x-access-token:%s' "$DATASETS_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          unset DATASETS_TOKEN
          # Per-command config: the header and a disabled hooks path (command-line precedence over .git/config).
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          export GIT_CONFIG_KEY_1="core.hooksPath" GIT_CONFIG_VALUE_1="/dev/null"
          for attempt in 1 2 3 4; do   # the first try plus up to 3 retries
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          echo "push failed after 3 retries"; exit 1

  # D11 (HISTORY_TOUCH_LIVE.md D11): the GRU rule-D arm. Its own job so that the 273-series model run never eats the
  # main job's 30-minute budget. It runs after `run` (pass or fail) on the same trigger; it pushes only
  # forecasts/q26-touch-live/d11/. Credential handling is identical to `run`. Public log: status and counts only.
  d11:
    needs: run
    if: ${{ !cancelled() && github.repository == 'The-Membrane/membrane-app' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: q26-datasets
    steps:
      - name: Choose the job
        id: job
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then job="$INPUT_JOB"
          elif [ "$SCHEDULE" = "17 0 * * *" ]; then job=issue
          elif [ "$SCHEDULE" = "47 0 * * *" ]; then job=score
          else echo "unknown trigger"; exit 1; fi
          case "$job" in issue|score) ;; *) echo "bad job $job"; exit 1 ;; esac
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "job: $job"

      # Sparse: the frozen development kline grids of the D11 universe (spent development sets only; no locked
      # blind set), the frozen rule-D weights and config, the D11 development inputs and the D11 live block.
      - name: Check out membrane-datasets (main, sparse, D11 inputs only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          repository: ${{ env.DATASETS_REPO }}
          token: ${{ secrets.DATASETS_TOKEN }}
          ref: main
          path: datasets
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /binance-klines/*-1h.json
            /final-blind-prices/binance-*-1h.json
            /blind3-prices/*-1h.json
            /blind4-prices/*-1h.json
            /blind5-prices/*-1h.json
            /blind6-prices/*-1h.json
            /blind7-prices/*-1h.json
            /history-forecasts/r11/r1110-p3-run-9ab156bb/acq/binance-*-1h.json.gz
            /history-forecasts/r16/r162e-cd-c41dff8f/frozen-r162e-ens5-D.pt
            /history-forecasts/r16/r162e-cd-c41dff8f/frozen-r162e-ens5-D.json
            /history-forecasts/r16/d11-inputs-b4f337cc/
            /forecasts/q26-touch-live/d11/

      - name: Record the datasets git config (checked again before the push)
        id: gitcfg
        run: echo "sha256=$(sha256sum datasets/.git/config | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Check out membrane-app at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.D11_APP_SHA }}
          path: app
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/research/history-forecasts

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7
        with:
          python-version: "3.12"

      - name: Install pinned dependencies (torch CPU build pinned; the block STOPs on any other build)
        run: |
          python -m pip install --disable-pip-version-check numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 pandas==3.0.5
          python -m pip install --disable-pip-version-check torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: D11 issue or score
        env:
          JOB: ${{ steps.job.outputs.job }}
        run: |
          set +x
          out="$RUNNER_TEMP/q26-d11.log"; rc=0
          python app/scripts/research/history-forecasts/live/q26_live_d11.py "$JOB" \
            --datasets datasets --out datasets --expect-commit "$D11_APP_SHA" \
            --devcal "$D11_INPUTS/devcal.npz" \
            --devcal-sha256 fdd053e5b36e7bb83455a3c236885588a58e130902dfd1d2fbaf1e8bdec24d7c \
            --golden "$D11_INPUTS/replay-golden.npz" \
            --golden-sha256 35f19207666c8a7c1be7853efcdb1063826da1cdfd940aab42312c73385febce \
            --workers 4 \
            >"$out" 2>&1 || rc=$?
          # Public log: status and counts only. The run's own output is withheld and deleted.
          echo "exit $rc; output withheld: $(wc -l <"$out") lines, STOP $(grep -c '^STOP' "$out" || true)," \
               "Traceback $(grep -c '^Traceback' "$out" || true)"
          grep -E '^d11 replay: [0-9]+ of [0-9]+ \(fH\) equal, [0-9]+ of [0-9]+ features equal, [0-9]+ of [0-9]+ look-ahead equal$' "$out" || true
          grep -E '^d11 klines: [0-9]+ ok, [0-9]+ failed, \+[0-9]+ klines$' "$out" || true
          grep -E '^d11 issue: [0-9]+ test series issued, [0-9]+ not issued$' "$out" || true
          grep -qE '^d11 issue: none ' "$out" && echo "d11 issue: none" || true
          grep -E '^d11 scored: [0-9]+ days finalized, [0-9]+ pending, ledger [0-9]+ days$' "$out" || true
          rm -f "$out"
          exit "$rc"

      - name: Commit forecasts/q26-touch-live/d11/ and push to membrane-datasets main (pull --rebase, up to 3 retries)
        working-directory: datasets
        env:
          JOB: ${{ steps.job.outputs.job }}
          GITCFG_SHA256: ${{ steps.gitcfg.outputs.sha256 }}
          DATASETS_TOKEN: ${{ secrets.DATASETS_TOKEN }}
        run: |
          set +x
          if [ "$(sha256sum .git/config | cut -c1-64)" != "$GITCFG_SHA256" ]; then
            echo "datasets .git/config changed after checkout; not pushing"; exit 1
          fi
          git config user.name "q26-live-bot"
          git config user.email "q26-live-bot@users.noreply.github.com"
          git add -- "$LIVE_DIR/d11"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "forecasts/q26-touch-live/d11: $JOB $(date -u +%Y-%m-%dT%H:%MZ) (Q26 D11 GRU arm, app ${D11_APP_SHA:0:7})" -- "$LIVE_DIR/d11"
          echo "committed $(git show --name-only --format= HEAD | wc -l) file(s)"
          auth="$(printf 'x-access-token:%s' "$DATASETS_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          unset DATASETS_TOKEN
          # Per-command config: the header and a disabled hooks path (command-line precedence over .git/config).
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          export GIT_CONFIG_KEY_1="core.hooksPath" GIT_CONFIG_VALUE_1="/dev/null"
          for attempt in 1 2 3 4; do   # the first try plus up to 3 retries
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          echo "push failed after 3 retries"; exit 1

  # D12 (HISTORY_TOUCH_LIVE.md D12): the live calibration monitor of the CALIBRATED-WARN cells. Its own job so that it
  # never eats the budget of `run` or `d11`. It runs after both (pass or fail) on the same trigger; it pushes only
  # forecasts/q26-touch-live/d12/. Credential handling is identical to `run`. Public log: status and counts only.
  d12:
    needs: [run, d11]
    if: ${{ !cancelled() && github.repository == 'The-Membrane/membrane-app' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: q26-datasets
    steps:
      - name: Choose the job
        id: job
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then job="$INPUT_JOB"
          elif [ "$SCHEDULE" = "17 0 * * *" ]; then job=issue
          elif [ "$SCHEDULE" = "47 0 * * *" ]; then job=score
