# Q26-R37 WEEKLY COUNT-ONLY CHECKPOINT -- membrane-datasets history-forecasts/r37/REGISTRATION.md section 5
# (sha256 acc0bcc51a737f377e9b8488dcfbde34bf9a29ba3a8c7bd65346f21fe347028c, frozen code commit 82157f79).
# Every Monday it runs `r37_grade.py --count-only --asof <that Monday 00:00Z>` on the D14 shadow log and commits the
# JSON to forecasts/q26-r37-counts/. COUNT ONLY: the grader prints sample counts against the minima and computes no
# metric; the confirmatory grade is refused by the code unless the stopping rule allows that ASOF, and this job never
# requests it. Owner approved 2026-10-28.
# OFF SWITCH: the job runs unless the repository variable R37_COUNT_ENABLED is exactly `false`.
# Code integrity: the run refuses unless every file under history-forecasts/r37/ matches its SHA256SUMS.
# Credential: DATASETS_TOKEN reaches only the datasets checkout (persist-credentials: false) and the push
#   (per-command extraheader). Keyless Binance data API only.
# PUBLIC LOGS: exit status, line counts and the count-only summary (counts, minima_met). No artifacts.

name: q26-r37-count

on:
  schedule:
    - cron: "53 1 * * 1"   # Mondays 01:53Z (off the :17/:23/:37/:47 jobs)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q26-r37-count
  cancel-in-progress: false

env:
  DATASETS_REPO: triccs/membrane-datasets
  R37_DIR: history-forecasts/r37
  COUNT_DIR: forecasts/q26-r37-counts

defaults:
  run:
    shell: bash

jobs:
  r37:
    if: ${{ !cancelled() && vars.R37_COUNT_ENABLED != 'false' && github.repository == 'The-Membrane/membrane-app' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: q26-datasets
    steps:
      - name: Check out membrane-datasets (main, full history without blobs, sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          repository: ${{ env.DATASETS_REPO }}
          token: ${{ secrets.DATASETS_TOKEN }}
          ref: main
          path: datasets
          fetch-depth: 0          # the grader reads the REGISTRATION.md add-commit time (must be before T_REG)
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /forecasts/q26-borrower-alert/private/
            /history-forecasts/r37/
            /forecasts/q26-r37-counts/

      - name: Record the datasets git config (checked again before the push)
        id: gitcfg
        run: echo "sha256=$(sha256sum datasets/.git/config | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Verify the registered R37 files (SHA256SUMS)
        working-directory: datasets/history-forecasts/r37
        run: sha256sum -c --quiet SHA256SUMS && echo "r37 sums ok"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7
        with:
          python-version: "3.12"

      - name: Install numpy and scipy
        run: python -m pip install -q "numpy==2.1.3" "scipy==1.14.1"

      - name: Restore the 1 m kline cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684   # v4.2.3
        with:
          path: ${{ runner.temp }}/r37-klines
          key: r37-klines-${{ github.run_id }}
          restore-keys: r37-klines-

      - name: R37 count-only checkpoint (last Monday 00:00Z)
        id: count
        run: |
          set +x
          now=$(date -u +%s)
          asof=$(( (now - 345600) / 604800 * 604800 + 345600 ))   # epoch 0 is a Thursday; Monday 00:00Z
          day=$(date -u -d "@$asof" +%Y-%m-%d)
          mkdir -p "datasets/$COUNT_DIR"
          out="$RUNNER_TEMP/q26-r37.log"; rc=0
          python -I "datasets/$R37_DIR/code/r37_grade.py" --datasets datasets --cache "$RUNNER_TEMP/r37-klines" \
            --asof "$asof" --count-only --out "datasets/$COUNT_DIR/r37-count-$day.json" >"$out" 2>&1 || rc=$?
          echo "asof $day; exit $rc; output: $(wc -l <"$out") lines, Traceback $(grep -c '^Traceback' "$out" || true)"
          if [ "$rc" = 0 ]; then
            python -I -c 'import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps({k: d[k] for k in ("counts","minima","minima_met") if k in d}))' \
              "datasets/$COUNT_DIR/r37-count-$day.json"
          fi
          rm -f "$out"
          exit "$rc"

      - name: Commit forecasts/q26-r37-counts/ and push to membrane-datasets main (pull --rebase, up to 3 retries)
        working-directory: datasets
        env:
          GITCFG_SHA256: ${{ steps.gitcfg.outputs.sha256 }}
          DATASETS_TOKEN: ${{ secrets.DATASETS_TOKEN }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          set +x
          if [ "$(sha256sum .git/config | cut -c1-64)" != "$GITCFG_SHA256" ]; then
            echo "datasets .git/config changed after checkout; not pushing"; exit 1
          fi
          git config user.name "q26-live-bot"
          git config user.email "q26-live-bot@users.noreply.github.com"
          git add -- "$COUNT_DIR"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "forecasts/q26-r37-counts: weekly count-only checkpoint $(date -u +%Y-%m-%d) (Q26-R37, no metric)" -- "$COUNT_DIR"
          auth="$(printf 'x-access-token:%s' "$DATASETS_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          unset DATASETS_TOKEN
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          export GIT_CONFIG_KEY_1="core.hooksPath" GIT_CONFIG_VALUE_1="/dev/null"
          for attempt in 1 2 3 4; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          echo "push failed after 3 retries"; exit 1
