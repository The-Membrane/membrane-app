            /final-blind-prices/binance-FILUSDT-1h.json
            /final-blind-prices/binance-INJUSDT-1h.json
            /final-blind-prices/binance-QNTUSDT-1h.json
            /final-blind-prices/binance-NEARUSDT-1h.json
            /final-blind-prices/binance-UNIUSDT-1h.json
            /final-blind-prices/binance-TRXUSDT-1h.json
            /final-blind-prices/binance-ZECUSDT-1h.json
